name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      snap: ${{ steps.filter.outputs.snap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            snap:
              - '**'
              - '!**.md'

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@3b5eb26cd2ff15d176be2c8424f4e036550041a4 # v2.14.11

  actionlint:
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@3b5eb26cd2ff15d176be2c8424f4e036550041a4 # v2.14.11

  build:
    name: 🔨 Build snap
    runs-on: ubuntu-latest
    needs:
      - actionlint
      - changes
    if: needs.changes.outputs.snap == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pin snap source to latest upstream release
        uses: ./.github/actions/pin-upstream-tag

      - name: Fetch attestation bundle
        uses: ./.github/actions/fetch-attestation
        with:
          repo: hrzlgnm/zux
          asset: zux_linux_x64

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
        shell: bash

      - name: Build snap
        run: sudo snapcraft pack --use-lxd --verbosity=brief
        shell: bash

      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zux-viz-amd64
          path: "*.snap"
          if-no-files-found: error

  alls-green:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - typos
      - actionlint
      - build
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        # No `# vN` comment: re-actors/alls-green publishes no versioned
        # releases, so the SHA pin is the whole pin.
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          jobs: ${{ toJSON(needs) }}
          # Only `build` is gated by the `changes` outputs and may
          # legitimately skip; the rest always run and must succeed.
          allowed-skips: >-
            build
