name: zux-viz
base: core24
adopt-info: zux
title: zux
summary: mDNS-SD visualizer with force-directed graph
description: |
  zux discovers services advertised on your local network via multicast DNS
  service discovery and renders them as an interactive force-directed graph,
  so you can see at a glance which services, instances, hosts and addresses
  are present and how they relate to one another.

website: https://github.com/hrzlgnm/zux
issues: https://github.com/hrzlgnm/zux/issues
source-code: https://github.com/hrzlgnm/zux
contact: https://github.com/hrzlgnm

grade: stable
confinement: strict
platforms:
  amd64:

apps:
  zux-viz:
    command: bin/zux-viz
    extensions: [gnome]
    plugs:
      - network
      - network-bind

parts:
  zux:
    plugin: nil
    source: https://github.com/hrzlgnm/zux.git
    # CI rewrites this line to the release tag being packaged.
    source-tag: v1.7.1
    override-pull: |
      craftctl default
      version="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
      if [ -z "$version" ]; then
          echo "The checked out source has no tag; refusing to guess a version" >&2
          exit 1
      fi
      craftctl set version="$version"
    override-build: |
      set -eu
      tag="$(git describe --tags --exact-match)"

      # Same artifact the AUR -bin package ships: the prebuilt,
      # unbundled Linux binary. Running outside a Tauri bundle layout
      # keeps upstream's auto-updater self-disabled; snap refresh owns
      # updates instead.
      asset="zux_linux_x64"
      url="https://github.com/hrzlgnm/zux/releases/download/${tag}/${asset}"
      curl -fsSL -o zux "$url"

      # Verify the binary's SLSA build provenance offline. The attestation
      # bundle and Sigstore trusted root are fetched on the runner (which has
      # a token) and mounted into this LXD build container via the project
      # directory. gh attestation verify --bundle --custom-trusted-root runs
      # fully offline (no auth, no network), so no GH_TOKEN is needed here.
      # This proves the artifact was produced by the upstream release workflow
      # from the tagged source commit, not merely that it matches the digest
      # GitHub lists for the release asset (which a compromised publish step
      # could rewrite).
      # core24's apt `gh` (2.45) predates the `attestation` subcommand, so
      # fetch a static CLI build and pin its checksum.
      gh_ver=2.98.0
      gh_tarball="gh_${gh_ver}_linux_amd64.tar.gz"
      curl -fsSL -o "$gh_tarball" \
        "https://github.com/cli/cli/releases/download/v${gh_ver}/${gh_tarball}"
      printf '%s  %s\n' \
        "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de" \
        "$gh_tarball" | sha256sum --check --status
      tar -xzf "$gh_tarball"
      gh_bin="$(pwd)/gh_${gh_ver}_linux_amd64/bin/gh"

      bundle="$(ls "$SNAPCRAFT_PROJECT_DIR"/sha256*.jsonl | head -1)"
      "$gh_bin" attestation verify zux \
        --repo hrzlgnm/zux \
        --bundle "$bundle" \
        --custom-trusted-root "$SNAPCRAFT_PROJECT_DIR/trusted_root.jsonl" \
        --cert-identity "https://github.com/hrzlgnm/zux/.github/workflows/release.yml@refs/tags/${tag}"

      install -Dm755 zux "$CRAFT_PART_INSTALL/bin/zux-viz"

      install -d "$CRAFT_PART_INSTALL/meta/gui" \
          "$CRAFT_PART_INSTALL/share/man/man1"
      install -m644 src-tauri/icons/128x128.png \
          "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -m644 docs/zux.1 \
          "$CRAFT_PART_INSTALL/share/man/man1/zux-viz.1"

      cat > "$CRAFT_PART_INSTALL/meta/gui/zux-viz.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=zux
      Comment=mDNS-SD visualizer with force-directed graph
      Exec=zux-viz %U
      Icon=\${SNAP}/meta/gui/icon.png
      Categories=Network;Utility;
      Terminal=false
      StartupWMClass=zux
      EOF
    build-packages:
      - ca-certificates
      - curl
      - git
