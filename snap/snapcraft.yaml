name: zux
base: core24
adopt-info: zux
summary: mDNS-SD visualizer with force-directed graph
description: |
  zux discovers services advertised on your local network via multicast DNS
  service discovery and renders them as an interactive force-directed graph,
  so you can see at a glance which services, instances, hosts and addresses
  are present and how they relate to one another.

grade: stable
confinement: strict
platforms:
  amd64:

apps:
  zux:
    command: bin/zux
    extensions: [gnome]
    plugs:
      - network
      - network-bind

parts:
  zux:
    plugin: nil
    source: https://github.com/hrzlgnm/zux.git
    # CI rewrites this line to the release tag being packaged.
    source-tag: v1.7.1
    override-pull: |
      craftctl default
      version="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
      if [ -z "$version" ]; then
          echo "The checked out source has no tag; refusing to guess a version" >&2
          exit 1
      fi
      craftctl set version="$version"
    override-build: |
      set -eu
      tag="$(git describe --tags --exact-match)"

      # Same artifact the AUR -bin package ships: the prebuilt,
      # unbundled Linux binary. Running outside a Tauri bundle layout
      # keeps upstream's auto-updater self-disabled; snap refresh owns
      # updates instead.
      # The binary's SLSA build provenance is verified on the runner
      # (see the "Verify upstream binary provenance" workflow step), where
      # the GitHub token is natively available; the build here only
      # downloads and installs the same asset.
      asset="zux_linux_x64"
      url="https://github.com/hrzlgnm/zux/releases/download/${tag}/${asset}"
      curl -fsSL -o zux "$url"

      install -Dm755 zux "$CRAFT_PART_INSTALL/bin/zux"

      install -d "$CRAFT_PART_INSTALL/meta/gui" \
          "$CRAFT_PART_INSTALL/share/man/man1"
      install -m644 src-tauri/icons/128x128.png \
          "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -m644 docs/zux.1 \
          "$CRAFT_PART_INSTALL/share/man/man1/zux.1"

      cat > "$CRAFT_PART_INSTALL/meta/gui/zux.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=zux
      Comment=mDNS-SD visualizer with force-directed graph
      Exec=zux %U
      Icon=\${SNAP}/meta/gui/icon.png
      Categories=Network;Utility;
      Terminal=false
      StartupWMClass=zux
      EOF
    build-packages:
      - ca-certificates
      - curl
      - git
